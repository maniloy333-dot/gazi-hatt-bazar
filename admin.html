<!DOCTYPE html><html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gazi Hatt-Bazar | Admin</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 18px;
      background: #f3f5f7;
      color: #222;
      font-family: Arial, sans-serif;
    }
    .container { max-width: 700px; margin: auto; }
    .card {
      background: white;
      padding: 20px;
      margin: 16px 0;
      border-radius: 12px;
      box-shadow: 0 2px 10px #0000000d;
    }
    h1 { color: #8b1e1e; font-size: 24px; }
    h2 { font-size: 19px; margin-top: 0; }
    input, textarea, select, button {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border: 1px solid #ddd;
      border-radius: 7px;
      font-size: 15px;
    }
    button {
      background: #8b1e1e;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    button.secondary { background: #444; }
    button.danger { background: #b42318; }
    .hidden { display: none; }
    .product, .order {
      border: 1px solid #eee;
      padding: 12px;
      border-radius: 8px;
      margin: 10px 0;
      overflow-wrap: anywhere;
    }
    .message { margin-top: 10px; overflow-wrap: anywhere; }
    .muted { color: #666; font-size: 13px; }
  </style>
</head>
<body>
<div class="container">
  <h1>Gazi Hatt-Bazar</h1>
  <p>Admin Panel — পণ্য ও অর্ডার পরিচালনা</p>  <section id="login" class="card">
    <h2>Admin Login</h2>
    <label for="password">Admin Password</label>
    <input id="password" type="password" autocomplete="current-password"
           placeholder="Admin password লিখুন">
    <button id="loginBtn">Login</button>
    <p id="loginMsg" class="message"></p>
    <p class="muted">আপনার পাসওয়ার্ড কাউকে দেবেন না।</p>
  </section>  <main id="dashboard" class="hidden">
    <section class="card">
      <h2>নতুন পণ্য যোগ করুন</h2>
      <form id="productForm">
        <input name="name" placeholder="পণ্যের নাম" required maxlength="150">
        <input name="category" placeholder="ক্যাটাগরি (যেমন Grocery/Fashion)"
               required maxlength="80">
        <input name="price" type="number" min="0.01" step="0.01"
               placeholder="দাম (৳)" required>
        <input name="image_url" type="url" placeholder="ছবির URL (ঐচ্ছিক)"
               maxlength="2000">
        <textarea name="description" placeholder="পণ্যের বিবরণ"
                  maxlength="2000"></textarea>
        <button type="submit">পণ্য যোগ করুন</button>
      </form>
      <p id="productMsg" class="message"></p>
    </section><section class="card">
  <h2>পণ্য পরিচালনা</h2>
  <button id="refreshProducts" class="secondary">পণ্য রিফ্রেশ করুন</button>
  <div id="products"></div>
</section>

<section class="card">
  <h2>সাম্প্রতিক অর্ডার</h2>
  <button id="refreshOrders" class="secondary">অর্ডার দেখুন / রিফ্রেশ</button>
  <div id="orders"></div>
  <p id="ordersMsg" class="message"></p>
</section>

<button id="logout" class="secondary">Logout</button>

  </main>
</div><script>
(() => {
  const API = "https://gazi-hatt-bazar-api.maniloy333.workers.dev";
  let adminPassword = "";

  const $ = id => document.getElementById(id);

  async function api(path, options = {}) {
    const headers = { ...(options.headers || {}) };

    if (adminPassword) {
      headers.Authorization = "Bearer " + adminPassword;
    }
    if (options.body) {
      headers["Content-Type"] = "application/json";
    }

    const response = await fetch(API + path, {
      ...options,
      headers
    });

    const data = await response.json();

    if (!response.ok || data.success === false) {
      throw new Error(data.error || "Request failed");
    }

    return data;
  }

  function showMessage(id, message, isError = false) {
    const el = $(id);
    el.textContent = message;
    el.style.color = isError ? "#b42318" : "#167344";
  }

  async function login() {
    adminPassword = $("password").value;

    if (!adminPassword) {
      showMessage("loginMsg", "পাসওয়ার্ড লিখুন।", true);
      return;
    }

    $("loginBtn").disabled = true;
    showMessage("loginMsg", "যাচাই করা হচ্ছে...");

    try {
      await api("/api/admin/orders");
      $("login").classList.add("hidden");
      $("dashboard").classList.remove("hidden");
      $("password").value = "";
      showMessage("loginMsg", "");
      await loadProducts();
      await loadOrders();
    } catch (error) {
      adminPassword = "";
      showMessage("loginMsg", "লগইন ব্যর্থ: " + error.message, true);
    } finally {
      $("loginBtn").disabled = false;
    }
  }

  async function loadProducts() {
    const box = $("products");
    box.textContent = "লোড হচ্ছে...";

    try {
      const data = await api("/api/products");
      box.replaceChildren();

      if (!data.products.length) {
        box.textContent = "এখনো কোনো পণ্য যোগ করা হয়নি।";
        return;
      }

      data.products.forEach(product => {
        const item = document.createElement("div");
        item.className = "product";

        const title = document.createElement("strong");
        title.textContent = product.name;

        const details = document.createElement("p");
        details.textContent =
          "ID: " + product.id + " | ক্যাটাগরি: " + product.category +
          " | দাম: ৳" + product.price;

        const price = document.createElement("input");
        price.type = "number";
        price.min = "0.01";
        price.step = "0.01";
        price.value = product.price;
        price.setAttribute("aria-label", "নতুন দাম");

        const update = document.createElement("button");
        update.textContent = "দাম পরিবর্তন";
        update.onclick = async () => {
          try {
            await api("/api/admin/products/" + product.id, {
              method: "PATCH",
              body: JSON.stringify({ price: Number(price.value) })
            });
            showMessage("productMsg", "দাম পরিবর্তন হয়েছে।");
            await loadProducts();
          } catch (error) {
            showMessage("productMsg", error.message, true);
          }
        };

        item.append(title, details, price, update);
        box.appendChild(item);
      });
    } catch (error) {
      box.textContent = "পণ্য লোড করা যায়নি: " + error.message;
    }
  }

  async function loadOrders() {
    $("orders").textContent = "লোড হচ্ছে...";
    showMessage("ordersMsg", "");

    try {
      const data = await api("/api/admin/orders");
      const box = $("orders");
      box.replaceChildren();

      if (!data.orders.length) {
        box.textContent = "এখনো কোনো অর্ডার আসেনি।";
        return;
      }

      data.orders.forEach(order => {
        const item = document.createElement("div");
        item.className = "order";

        const title = document.createElement("strong");
        title.textContent = "অর্ডার #" + order.id;

        const details = document.createElement("p");
        details.textContent =
          "ক্রেতা: " + order.customer_name +
          " | ফোন: " + order.phone +
          " | মোট: ৳" + order.total +
          " | অবস্থা: " + order.status;

        const address = document.createElement("p");
        address.textContent = "ঠিকানা: " + order.address;

        const items = document.createElement("p");
        items.textContent = "পণ্য: " + order.items;

        item.append(title, details, address, items);
        box.appendChild(item);
      });
    } catch (error) {
      $("orders").textContent = "";
      showMessage("ordersMsg", "অর্ডার লোড হয়নি: " + error.message, true);
    }
  }

  $("loginBtn").addEventListener("click", login);

  $("password").addEventListener("keydown", event => {
    if (event.key === "Enter") login();
  });

  $("productForm").addEventListener("submit", async event => {
    event.preventDefault();
    const form = event.currentTarget;
    const values = new FormData(form);

    const product = {
      name: values.get("name").trim(),
      category: values.get("category").trim(),
      price: Number(values.get("price")),
      image_url: values.get("image_url").trim(),
      description: values.get("description").trim()
    };

    try {
      await api("/api/admin/products", {
        method: "POST",
        body: JSON.stringify(product)
      });

      form.reset();
      showMessage("productMsg", "নতুন পণ্য সফলভাবে যোগ হয়েছে।");
      await loadProducts();
    } catch (error) {
      showMessage("productMsg", "পণ্য যোগ হয়নি: " + error.message, true);
    }
  });

  $("refreshProducts").addEventListener("click", loadProducts);
  $("refreshOrders").addEventListener("click", loadOrders);

  $("logout").addEventListener("click", () => {
    adminPassword = "";
    $("dashboard").classList.add("hidden");
    $("login").classList.remove("hidden");
    $("orders").replaceChildren();
    $("products").replaceChildren();
    showMessage("loginMsg", "আপনি লগআউট করেছেন।");
  });
})();
</script></body>
</html>
